# The dedicated server image (SERVER.md, "Docker"): every published release builds GoF2 > Build > Linux Dedicated Server
# from its commit (docker/build-server.sh) and pushes ghcr.io/<owner>/gof2-server:<tag> and :latest. Run it by hand for
# an older tag (that tag only).
# Secrets: UNITY_EMAIL and UNITY_PASSWORD, a Unity account without two-factor sign-in (its Personal licence is activated
# for the build and returned afterwards).
# Git LFS: only what the server build keeps; the textures (stripped from a server build) and Reference/ Modding/ stay
# pointers, ~420 MB instead of 2.5 GB, and the objects are cached between runs.
name: Server image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
      version:
        description: Shown version (yyyy.MM.dd.HHmm, the release's other builds'); empty = the commit's time
        required: false

permissions:
  contents: read
  packages: write

concurrency: server-image

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  LFS_EXCLUDE: "*.png,Reference/**,Modding/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          lfs: false

      - name: LFS objects to fetch
        run: git lfs ls-files --long --exclude="$LFS_EXCLUDE" | cut -d' ' -f1 | sort > .lfs-ids

      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-server-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-server-

      - name: Git LFS
        run: git lfs pull --exclude="$LFS_EXCLUDE" && rm .lfs-ids

      - name: Build the server
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GOF2_BUILD_VERSION: ${{ inputs.version }}
        run: docker/build-server.sh && rm -rf Build/LinuxServer/*_BackUpThisFolder_ButDontShipItWithYourGame

      - name: Image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gof2-server"
          docker build -t "$image:$TAG" -f docker/server.Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$TAG" Build/LinuxServer
          # It must come up as a server before it is published.
          docker run -d --name smoke "$image:$TAG"
          timeout 180 sh -c 'until docker logs smoke 2>&1 | grep -q "Type \"help\""; do sleep 2; done' || { docker logs smoke 2>&1 | tail -50; exit 1; }
          docker logs smoke 2>&1 | grep -m1 "dedicated server, build"
          docker rm -f smoke
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$TAG"
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$PRERELEASE" != true ]; then
            docker tag "$image:$TAG" "$image:latest" && docker push "$image:latest"
          fi
